
<!-- feature-brainstorm page runtime. Appended to the end of a brainstorm page with `cat`; turns the markup from
     SKILL.md › "Output format" into a page the user answers in place (pick, notes, Respond). Keep it self-contained:
     the desktop side panel loads pages as standalone copies, so linked files would not load. -->

<style data-bs>
  :root {
    --bg: #f6f5f1; --surface: #fff; --surface-2: #efede7; --ink: #1d1c1a; --ink-2: #55524c; --ink-3: #8a867e;
    --line: #e2dfd6; --accent: #b4541f; --accent-soft: #fbf1ea; --on-accent: #fff; --pro: #2c7a4d; --con: #b03a2c;
    --term: #1a1c1e; --term-ink: #d9dbd4;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131312; --surface: #1c1c1a; --surface-2: #252522; --ink: #ecebe5; --ink-2: #b2afa6; --ink-3: #7e7b73;
      --line: #33322e; --accent: #e08a5c; --accent-soft: #2a1d16; --on-accent: #1a0f09; --pro: #7fcb9c; --con: #ec8c7c;
      --term: #0c0d0e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
  code { font: .86em var(--mono); background: var(--surface-2); padding: .05em .35em; border-radius: 5px; }
  .bs { max-width: 1080px; margin: 0 auto; padding: 36px 28px 120px; }
  @media (max-width: 640px) { .bs { padding: 22px 16px 120px; } }
  .bs h1 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.2; letter-spacing: -.01em; margin: 0 0 10px; }
  .bs .goal { margin: 0; max-width: 760px; font-size: 16.5px; color: var(--ink-2); }
  .bs .goal b { color: var(--ink); }
  .bs-h { margin: 34px 0 12px; font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .bs .context { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .bs .context li { padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; color: var(--ink-2); }

  .bs-options { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .bs .option { margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .bs .option.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .bs-head { display: flex; align-items: flex-start; gap: 10px; }
  .bs-letter { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); font-weight: 700; }
  .picked .bs-letter { background: var(--accent); color: var(--on-accent); }
  .bs .option h2 { margin: 0; font-size: 16px; line-height: 1.3; }
  .bs-tag { display: inline-block; margin-top: 2px; font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
  .bs-pick { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .bs-pick input { accent-color: var(--accent); margin: 0; }
  .picked .bs-pick { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .bs .how { margin: 0; font-size: 14px; color: var(--ink-2); }
  .bs .pros, .bs .cons { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 14px; }
  .bs .pros li, .bs .cons li { position: relative; padding-left: 20px; }
  .bs .pros li::before, .bs .cons li::before { position: absolute; left: 2px; font-weight: 700; }
  .bs .pros li::before { content: "+"; color: var(--pro); }
  .bs .cons li::before { content: "−"; color: var(--con); }
  .bs .sketch { margin: 0; padding: 10px 12px; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 12.5px; }
  .bs pre.sketch { background: var(--term); color: var(--term-ink); border-color: transparent; font: 12px/1.6 var(--mono); white-space: pre; }
  .bs-foot { margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .bs .effort { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .bs-meter { display: inline-flex; gap: 3px; }
  .bs-meter i { width: 13px; height: 6px; border-radius: 3px; background: var(--surface-2); }
  .bs-meter i.on { background: var(--ink-2); }
  .bs-btn { font: 600 13px var(--sans); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; }
  .bs-btn:hover { border-color: var(--ink-3); }
  .bs-btn.pri { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .bs textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; font: 14px/1.45 var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  .bs textarea[hidden] { display: none; }

  .bs .recommendation { margin: 0; padding: 16px 18px; border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); font-size: 15.5px; }
  .bs .recommendation b { color: var(--accent); }
  .bs .ask { margin: 0 0 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; gap: 6px; }
  .bs .ask legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 650; }
  .bs .ask label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .bs .ask label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .bs .ask input { accent-color: var(--accent); }
  .bs .ask small { color: var(--ink-3); font-size: 13px; }

  .bs-bar { position: fixed; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); font-size: 13.5px; max-width: calc(100% - 32px); }
  .bs-bar .bs-btn { border-radius: 99px; }
  .bs-sheet { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, .4); }
  .bs-sheet[hidden] { display: none; }
  .bs-sheet > div { width: min(640px, 100%); max-height: 86vh; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: var(--surface); border-radius: 14px; }
  .bs-sheet pre { margin: 0; flex: 1; overflow: auto; padding: 12px; background: var(--surface-2); border-radius: 8px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; }
  .bs-sheet .row { display: flex; justify-content: flex-end; gap: 8px; }
</style>
<script data-bs>
(() => {
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const heading = text => el('div', 'bs-h', text);
  const plain = node => { const c = node.cloneNode(true); $$('small, .bs-tag', c).forEach(n => n.remove()); return c.textContent.replace(/\s+/g, ' ').trim(); };

  // Wrap the content in <main>, leaving the runtime's own tags in place.
  const main = el('main', 'bs');
  [...document.body.childNodes].forEach(n => { if (!(n.nodeType === 1 && n.hasAttribute('data-bs'))) main.appendChild(n); });
  document.body.prepend(main);

  const h1 = main.querySelector('h1');
  const title = h1 ? h1.textContent.trim() : document.title;
  if (!document.title) document.title = title;
  const goal = main.querySelector('.goal');
  if (goal) goal.prepend(el('b', '', 'Goal: '));
  const context = main.querySelector('.context');
  if (context) context.before(heading('Context'));

  // Options
  const recEl = main.querySelector('.recommendation');
  const optEls = $$('.option', main);
  const options = optEls.map((o, i) => ({ el: o, letter: o.id || 'ABCDEF'[i], name: (o.querySelector('h2') || {}).textContent || '' }));
  const rec = (recEl && recEl.dataset.option) || (options.find(o => o.el.hasAttribute('data-recommended')) || {}).letter;
  if (optEls.length) {
    const grid = el('div', 'bs-options');
    optEls[0].before(heading('Options'), grid);
    options.forEach(o => {
      grid.appendChild(o.el);
      const h2 = o.el.querySelector('h2');
      const head = el('div', 'bs-head');
      head.appendChild(el('div', 'bs-letter', o.letter));
      const name = el('div');
      if (h2) name.appendChild(h2);
      if (o.letter === rec) name.appendChild(el('span', 'bs-tag', 'Recommended'));
      head.appendChild(name);
      const pick = el('label', 'bs-pick', `<input type="radio" name="bs-pick" value="${o.letter}"> Pick`);
      head.appendChild(pick);
      o.el.prepend(head);

      const foot = el('div', 'bs-foot');
      const effort = o.el.querySelector('.effort');
      if (effort) {
        const level = { small: 1, medium: 2, large: 3 }[(effort.textContent.match(/small|medium|large/i) || [''])[0].toLowerCase()] || 0;
        const meter = el('span', 'bs-meter', [1, 2, 3].map(n => `<i class="${n <= level ? 'on' : ''}"></i>`).join(''));
        effort.prepend(meter);
        foot.appendChild(effort);
      } else foot.appendChild(el('span'));
      const noteBtn = el('button', 'bs-btn', 'Add note');
      noteBtn.type = 'button';
      foot.appendChild(noteBtn);
      o.el.appendChild(foot);
      o.note = el('textarea');
      o.note.placeholder = `Note on ${o.letter}`;
      o.note.hidden = true;
      o.el.appendChild(o.note);
      noteBtn.onclick = () => { o.note.hidden = false; o.note.focus(); };
    });
  }

  if (recEl) {
    const r = options.find(o => o.letter === rec);
    if (rec) recEl.prepend(el('b', '', `${rec}${r ? ' · ' + r.name : ''}. `));
    recEl.before(heading('Recommendation'));
  }

  // Questions
  const asks = $$('fieldset.ask', main).map(f => {
    const legend = f.querySelector('legend');
    const def = f.querySelector('input:checked');
    if (def) def.closest('label').appendChild(el('span', 'bs-tag', 'Suggested'));
    return { el: f, q: legend ? legend.textContent.trim() : f.id, name: (f.querySelector('input') || {}).name, def: def && def.value };
  });
  if (asks.length) asks[0].el.before(heading('Questions'));

  main.appendChild(heading('Anything else'));
  const general = el('textarea');
  general.placeholder = 'A note for Claude, if any';
  main.appendChild(general);

  // Respond bar and sheet
  const status = el('span');
  const respondBtn = el('button', 'bs-btn pri', 'Respond');
  const bar = el('div', 'bs-bar');
  bar.append(status, respondBtn);
  const out = el('pre');
  const copyBtn = el('button', 'bs-btn pri', 'Copy response');
  const closeBtn = el('button', 'bs-btn', 'Close');
  const sheet = el('div', 'bs-sheet');
  const panel = el('div');
  const row = el('div', 'row');
  row.append(closeBtn, copyBtn);
  panel.append(out, row);
  sheet.appendChild(panel);
  sheet.hidden = true;
  document.body.append(bar, sheet);

  // State, kept per page so a reload does not lose answers
  const key = 'bs:' + location.pathname + ':' + title;
  const pickInputs = $$('input[name="bs-pick"]', main);
  const picked = () => (pickInputs.find(i => i.checked) || {}).value;
  const save = () => {
    const s = { pick: picked(), notes: Object.fromEntries(options.map(o => [o.letter, o.note.value])), general: general.value,
      asks: Object.fromEntries(asks.map(a => [a.name, (a.el.querySelector('input:checked') || {}).value])) };
    try { localStorage.setItem(key, JSON.stringify(s)); } catch (e) {}
  };
  let s = null;
  try { s = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  const start = (s && s.pick) || rec;
  pickInputs.forEach(i => { i.checked = i.value === start; });
  if (s) {
    options.forEach(o => { o.note.value = (s.notes || {})[o.letter] || ''; o.note.hidden = !o.note.value; });
    general.value = s.general || '';
    asks.forEach(a => { const v = (s.asks || {})[a.name]; const i = v && a.el.querySelector(`input[value="${CSS.escape(v)}"]`); if (i) i.checked = true; });
  }

  const refresh = () => {
    const p = picked();
    options.forEach(o => o.el.classList.toggle('picked', o.letter === p));
    const notes = options.filter(o => o.note.value.trim()).length + (general.value.trim() ? 1 : 0);
    status.textContent = `Pick: ${p || '—'}` + (notes ? ` · ${notes} note${notes > 1 ? 's' : ''}` : '');
    save();
  };
  main.addEventListener('input', refresh);
  main.addEventListener('change', refresh);
  refresh();

  const quote = text => text.trim().split('\n').map(l => '  > ' + l).join('\n');
  const response = () => {
    const p = picked();
    const opt = options.find(o => o.letter === p);
    const L = [`# Re: ${title}`, ''];
    L.push(`**Pick:** ${p ? `${p} · ${opt.name}` : 'none'}` + (p && rec ? (p === rec ? '  _(as recommended)_' : `  ✎ (recommended: ${rec})`) : ''));
    if (asks.length) {
      L.push('', '## Questions');
      asks.forEach((a, i) => {
        const cur = a.el.querySelector('input:checked');
        const defLabel = a.def && a.el.querySelector(`input[value="${CSS.escape(a.def)}"]`);
        const changed = cur && a.def && cur.value !== a.def;
        L.push(`${i + 1}. ${a.q}`);
        L.push(`   → **${cur ? plain(cur.closest('label')) : 'no answer'}**` + (changed ? `  ✎ (was: ${plain(defLabel.closest('label'))})` : cur ? '  _(kept as suggested)_' : ''));
      });
    }
    const noted = options.filter(o => o.note.value.trim());
    if (noted.length || general.value.trim()) {
      L.push('', '## Notes');
      noted.forEach(o => L.push(`- **${o.letter} · ${o.name}**`, quote(o.note.value)));
      if (general.value.trim()) L.push('- **General**', quote(general.value));
      L.push('', '_Lines that start with ">" are text the reader typed._');
    }
    return L.join('\n');
  };

  respondBtn.onclick = () => { out.textContent = response(); sheet.hidden = false; };
  closeBtn.onclick = () => { sheet.hidden = true; };
  sheet.onclick = e => { if (e.target === sheet) sheet.hidden = true; };
  copyBtn.onclick = async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(out.textContent); ok = true; } catch (e) {
      const r = document.createRange(); r.selectNodeContents(out);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { ok = document.execCommand('copy'); } catch (e2) {}
    }
    copyBtn.textContent = ok ? 'Copied. Paste it in Claude' : 'Select the text and copy it';
    setTimeout(() => { copyBtn.textContent = 'Copy response'; }, 2000);
  };
})();
</script>
